openapi: 3.0.3
info:
  title: Customer Orders API
  version: 1.0.0
  description: Order history search and CSV export (ADO PBI 268). Requires Entra ID bearer token with app role "Support".
security:
  - bearerAuth: []
paths:
  /api/customers/{id}/orders:
    get:
      summary: Paged, filtered order search
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Status'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Page of orders (20 per page), newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedOrders' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Not authenticated }
        '403': { description: Not in Support role }
        '404': { $ref: '#/components/responses/Problem' }
  /api/customers/{id}/orders/export:
    get:
      summary: CSV of all orders matching the filters (max 10,000)
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: >
            RFC 4180 CSV, header `OrderId,OrderDate,Total,Status`, ISO 8601 UTC dates,
            CRLF line endings. Header only when no rows match.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="orders-C123-20261016.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Not authenticated }
        '403': { description: Not in Support role }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: More than 10,000 rows match; narrow the filters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inclusive start day (UTC)
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end day (UTC)
      schema: { type: string, format: date }
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [All, Pending, Shipped, Delivered, Cancelled]
        default: All
  responses:
    Problem:
      description: Error details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    OrderSummary:
      type: object
      properties:
        orderId: { type: string }
        orderDate: { type: string, format: date-time }
        total: { type: number, format: decimal }
        status: { type: string, enum: [Pending, Shipped, Delivered, Cancelled] }
    PagedOrders:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer }
        totalPages: { type: integer }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
